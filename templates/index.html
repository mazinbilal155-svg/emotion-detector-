<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Emotion Detector</title>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter text to analyze emotions:</p>
    <input type="text" id="textToAnalyze" size="50">
    <button onclick="runSentiment()">Run Analysis</button>
    <p id="response_div"></p>

    <script>
        function runSentiment() {
            let text = document.getElementById("textToAnalyze").value;
            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById("response_div").innerHTML = xhttp.responseText;
                }
            };
            xhttp.open("GET", "/emotionDetector?text=" + encodeURIComponent(text), true);
            xhttp.send();
        }
    </script>
</body>
</html>
